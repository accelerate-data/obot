# TEMPORARY. Delete with pkg/mcp/docker_ceiling_proof_test.go once the
# acceptance evidence for VD-4348 is recorded. It exists only to run the
# Docker-gated proof on a runner with a real Docker daemon, because the
# repository's normal workflows trigger on main and pull requests only.
name: tmp vd-4348 ceiling proof

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/vd-4348-*'

jobs:
  proof:
    name: docker ceiling proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Show Docker daemon
        run: docker version

      - name: Run the ceiling proof
        run: go test ./pkg/mcp/ -run TestDockerCeilingLandsOnRealContainer -v -count=1

      - name: Fail if the proof skipped
        run: |
          set -euo pipefail
          output="$(go test ./pkg/mcp/ -run TestDockerCeilingLandsOnRealContainer -v -count=1)"
          echo "$output"
          if echo "$output" | grep -q -- "--- SKIP"; then
            echo "::error::the proof skipped instead of running against a real daemon"
            exit 1
          fi

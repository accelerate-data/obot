name: Test Docker Build

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:

env:
  PROVIDERS_IMAGE: ghcr.io/accelerate-data/providers-vibedata:latest
  ENCRYPTION_BINS_IMAGE: ghcr.io/accelerate-data/providers-vibedata/encryption-bins:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            PROVIDERS_IMAGE=${{ env.PROVIDERS_IMAGE }}
            ENCRYPTION_BINS_IMAGE=${{ env.ENCRYPTION_BINS_IMAGE }}

      - name: Load AMD64 image for embedded PostgreSQL tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: obot:embedded-postgres-test
          build-args: |
            PROVIDERS_IMAGE=${{ env.PROVIDERS_IMAGE }}
            ENCRYPTION_BINS_IMAGE=${{ env.ENCRYPTION_BINS_IMAGE }}

      - name: Test embedded PostgreSQL startup and migration
        timeout-minutes: 15
        run: bash tools/test-embedded-postgres.sh obot:embedded-postgres-test

      - name: Upload embedded PostgreSQL test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-postgres-test-logs
          path: /tmp/obot-embedded-postgres-*/logs/
